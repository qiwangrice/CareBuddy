version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: carebuddy-neo4j
    ports:
      - "7687:7687"  # Bolt protocol (for applications like Python driver)
      - "7474:7474"  # HTTP Browser UI
    environment:
      NEO4J_AUTH: neo4j/carebuddy_password
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_dbms_memory_heap_initial__size: 2G
      NEO4J_dbms_memory_heap_max__size: 4G
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    networks:
      - carebuddy-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local

networks:
  carebuddy-network:
    driver: bridge
